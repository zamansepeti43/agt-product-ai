name: Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Web app URL to package"
        required: false
        default: "https://agt-product-ai.vercel.app"

permissions:
  contents: write

env:
  APP_URL: ${{ github.event.inputs.app_url || 'https://agt-product-ai.vercel.app' }}
  APK_PASSWORD: agtproductai

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -PappUrl="$APP_URL"

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/agt-product-ai.keystore" \
            -alias agtproductai \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$APK_PASSWORD" \
            -keypass "$APK_PASSWORD" \
            -dname "CN=AGT Product AI, OU=AGT Studio, O=AGT Studio, L=Istanbul, ST=Istanbul, C=TR"

      - name: Sign and verify APK
        run: |
          mkdir -p dist
          UNSIGNED="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="dist/AGT-Product-AI.apk"
          cp "$UNSIGNED" "$SIGNED"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/agt-product-ai.keystore" --ks-key-alias agtproductai --ks-pass pass:"$APK_PASSWORD" --key-pass pass:"$APK_PASSWORD" --out "$SIGNED" "$UNSIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGT-Product-AI-APK
          path: dist/AGT-Product-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AGT Product AI APK ${{ github.run_number }}
          body: "AGT Product AI Android APK. Signed and verified automatically from main."
          files: dist/AGT-Product-AI.apk
          make_latest: true
