name: Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Web app URL to package"
        required: false
        default: "https://agt-product-ai.vercel.app"

permissions:
  contents: write

env:
  APP_URL: ${{ github.event.inputs.app_url || 'https://agt-product-ai.vercel.app' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease -PappUrl="$APP_URL"

      - name: Prepare APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" "dist/AGT-Product-AI.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGT-Product-AI-APK
          path: dist/AGT-Product-AI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AGT Product AI APK ${{ github.run_number }}
          body: "AGT Product AI Android APK. Built automatically from main."
          files: dist/AGT-Product-AI.apk
          make_latest: true
