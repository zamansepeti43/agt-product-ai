name: Android APK
on:
  push:
    branches: [main]
    paths: ["android/**","mobile-dist/**",".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Bundle app
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/mobile-dist
          cp mobile-dist/index.html mobile-dist/app.js mobile-dist/styles.css android/app/src/main/assets/mobile-dist/
      - name: Build
        working-directory: android
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AGT-Product-AI-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30