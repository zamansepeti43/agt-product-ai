name: Android APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-apk.yml","android/**","mobile-dist/**"]
  workflow_dispatch:
permissions: { contents: write }
env: { APK_PASSWORD: agtproductai }
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Bundle standalone app
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/mobile-dist
          cp mobile-dist/index.html mobile-dist/app.js mobile-dist/styles.css android/app/src/main/assets/mobile-dist/
      - name: Build
        working-directory: android
        run: gradle assembleRelease
      - name: Signing key
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/agt.keystore" -alias agtproductai -keyalg RSA -keysize 2048 -validity 10000 -storepass "$APK_PASSWORD" -keypass "$APK_PASSWORD" -dname "CN=AGT Product AI, O=AGT Studio, C=TR"
      - name: Sign
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/agt.keystore" --ks-key-alias agtproductai --ks-pass pass:"$APK_PASSWORD" --key-pass pass:"$APK_PASSWORD" --out dist/AGT-Product-AI.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AGT-Product-AI.apk
      - uses: actions/upload-artifact@v4
        with: { name: AGT-Product-AI-APK, path: dist/AGT-Product-AI.apk, retention-days: 30 }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AGT Product AI APK ${{ github.run_number }}
          body: "Standalone AGT Product AI APK."
          files: dist/AGT-Product-AI.apk
          make_latest: true