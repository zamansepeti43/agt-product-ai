name: Android APK
on:
  push:
    branches: [main]
    paths: ["android/**","mobile-dist/**",".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Bundle complete app UI
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp mobile-dist/index.html mobile-dist/app.js mobile-dist/styles.css mobile-dist/agt-icon.svg android/app/src/main/assets/
      - name: Build
        working-directory: android
        run: gradle assembleDebug
      - name: Publish installable test APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-test-${GITHUB_RUN_NUMBER}" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "AGT Product AI APK Test #${GITHUB_RUN_NUMBER}" \
            --notes "Installable debug APK. Full AGT Product AI UI is bundled locally in the APK."
      - uses: actions/upload-artifact@v4
        with:
          name: AGT-Product-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
