name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Hosted AGT Product AI URL"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Resolve app URL
        shell: bash
        env:
          INPUT_APP_URL: ${{ inputs.app_url }}
          TAG_APP_URL: ${{ vars.AGT_PRODUCT_AI_URL }}
        run: |
          URL="${INPUT_APP_URL:-$TAG_APP_URL}"
          if [ -z "$URL" ]; then echo "AGT_PRODUCT_AI_URL is not configured."; exit 1; fi
          case "$URL" in https://*) ;; *) echo "Production APK requires an HTTPS app URL."; exit 1;; esac
          echo "AGT_PRODUCT_AI_URL=$URL" >> "$GITHUB_ENV"
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli
      - name: Generate Android platform
        run: rm -rf android && npx cap add android && npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agt-product-ai-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
