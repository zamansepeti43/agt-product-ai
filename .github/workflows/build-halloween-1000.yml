name: Build Halloween 1000 Asset Pack

on:
  push:
    branches:
      - asset-build-halloween-1000
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build sourced CC0 Halloween pack
        run: |
          set -euo pipefail
          mkdir -p build
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/ikks/openclipartcollection.git build/openclipart
          git -C build/openclipart ls-tree -r --name-only HEAD > build/all_paths.txt
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/cyanidecupcake/openclipart-svg.git build/openclipart2
          git -C build/openclipart2 ls-tree -r --name-only HEAD > build/all_paths2.txt
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/millette/oca.git build/openclipart3
          git -C build/openclipart3 ls-tree -r --name-only HEAD > build/all_paths3.txt
          git clone --filter=blob:none --no-checkout --depth=1 https://github.com/rg1024/openclipart-public.git build/openclipart4
          git -C build/openclipart4 ls-tree -r --name-only HEAD > build/all_paths4.txt

          cat > build/make_pack.py <<'PY'
          import re, json, hashlib, subprocess, urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          
          ROOT = Path("build/halloween_1000")
          ROOT.mkdir(parents=True, exist_ok=True)
          RAW = "https://raw.githubusercontent.com/ikks/openclipartcollection/main/"
          paths = ["A::"+x.strip() for x in Path("build/all_paths.txt").read_text(errors="ignore").splitlines() if x.strip().lower().endswith(".svg")] + ["B::"+x.strip() for x in Path("build/all_paths2.txt").read_text(errors="ignore").splitlines() if x.strip().lower().endswith(".svg")] + ["C::"+x.strip() for x in Path("build/all_paths3.txt").read_text(errors="ignore").splitlines() if x.strip().lower().endswith(".svg")] + ["D::"+x.strip() for x in Path("build/all_paths4.txt").read_text(errors="ignore").splitlines() if x.strip().lower().endswith(".svg")]

          categories = {
              "01_Pumpkins": ["pumpkin", "jack-o-lantern", "jack_o_lantern", "jackolantern"],
              "02_Bats_Night_Flyers": ["bat", "bats", "raven", "crow", "owl"],
              "03_Ghosts_Spirits_Undead": ["ghost", "ghosts", "phantom", "specter", "spectre", "spirit", "wraith", "ghoul", "haunt", "poltergeist", "apparition", "undead", "spectral", "ectoplasm", "haunting", "ghostly", "phantasm", "revenant", "boo", "zombie", "vampire"],
              "04_Witches_Brooms": ["witch", "witches", "broom", "broomstick", "cauldron", "wizard", "wizard-hat", "wizard_hat", "mage", "sorcerer", "sorcery", "magic", "wand", "potion"],
              "05_Spiders_Webs": ["spider", "spiders", "spiderweb", "cobweb", "web"],
              "06_Skulls_Skeletons": ["skull", "skulls", "skeleton", "bones", "bone"],
              "07_Cats_Felines": ["cat", "cats", "kitten", "feline"],
              "08_Graveyard_Tombstones": ["graveyard", "grave", "gravestone", "tombstone", "cemetery", "churchyard", "crypt", "tomb", "coffin", "church", "chapel", "mausoleum", "catacomb", "cemetery-gate", "cemetery_gate", "gargoyle", "dead-tree", "dead_tree", "funeral", "skeleton", "zombie", "vampire", "werewolf", "undead"],
              "09_Haunted_Gothic_Buildings": ["haunted-house", "haunted_house", "haunted", "spooky-house", "spooky_house", "mansion", "manor", "castle", "gothic-building"],
              "10_Halloween_Gothic_Decor": ["halloween", "gothic", "spooky", "horror", "trick-or-treat", "cauldron", "candy", "pumpkin-carving"]
          }

          forbidden = ["logo","brand","trademark","advertisement","favicon","sprite","pixel","mario","batman","superman","disney","pokemon"]
          cross = {
              "01_Pumpkins":["bat","ghost","witch","spider","skull","skeleton","cat","grave","tombstone","house"],
              "02_Bats_Night_Flyers":["pumpkin","ghost","witch","spider","skull","skeleton","cat","grave","tombstone","house"],
              "03_Ghosts_Spirits":["pumpkin","bat","witch","spider","skull","skeleton","cat","grave","tombstone","house"],
              "04_Witches_Brooms":["pumpkin","bat","ghost","spider","skull","skeleton","cat","grave","tombstone","house"],
              "05_Spiders_Webs":["pumpkin","bat","ghost","witch","skull","skeleton","cat","grave","tombstone","house"],
              "06_Skulls_Skeletons":["pumpkin","bat","ghost","witch","spider","cat","grave","tombstone","house"],
              "07_Cats_Felines":["pumpkin","bat","ghost","witch","spider","skull","skeleton","grave","tombstone","house"],
              "08_Graveyard_Tombstones":["pumpkin","bat","witch"],
              "09_Haunted_Gothic_Buildings":["pumpkin","bat","ghost","witch","spider","skull","skeleton","cat","grave","tombstone"],
              "10_Halloween_Gothic_Decor":["pumpkin","bat","ghost","witch","spider","skull","skeleton","cat","grave","tombstone","haunted-house","haunted_house"]
          }

          def raw(item):
              source, path = item.split("::",1)
              base = {"A":RAW,"B":"https://raw.githubusercontent.com/cyanidecupcake/openclipart-svg/master/","C":"https://raw.githubusercontent.com/millette/oca/master/","D":"https://raw.githubusercontent.com/rg1024/openclipart-public/master/"}[source]
              url = base + urllib.parse.quote(path, safe="/")
              p = subprocess.run(["curl","-fsSL","--retry","2",url], capture_output=True)
              return p.stdout if p.returncode == 0 else b""

          def usable(path, data, category):
              low = path.lower()
              if any(x in low for x in forbidden):
                  return False
              if any(x in low for x in cross.get(category, [])):
                  return False
              min_size = 250 if category == "08_Graveyard_Tombstones" else 700
              max_size = 2000000 if category == "08_Graveyard_Tombstones" else 800000
              if len(data) < min_size or len(data) > max_size:
                  return False
              return data.lstrip().startswith(b"<") and b"<svg" in data[:10000].lower()

          global_hashes = set()
          manifest = {"source":"https://github.com/ikks/openclipartcollection","license":"OpenClipart public domain / CC0","categories":{}}

          for category, terms in categories.items():
              out = ROOT / category
              out.mkdir(parents=True, exist_ok=True)
              candidates = []
              for path in paths:
                  low = path.split("::",1)[-1].lower()
                  norm = re.sub(r"[^a-z0-9]+", " ", low).strip()
                  if any(re.search(r"(?<![a-z0-9])" + re.escape(term.lower()).replace(" ", r"[ _-]+") + r"(?![a-z0-9])", norm) for term in terms):
                      candidates.append(path)
              # Stable ordering: shorter/specific names first, then lexical.
              candidates = sorted(set(candidates), key=lambda p:(len(p),p.lower()))
              print(f"{category}: candidates={len(candidates)} first={candidates[:5]}")
              selected = 0
              entries = []
              with ThreadPoolExecutor(max_workers=24) as ex:
                  downloaded = list(ex.map(raw, candidates[:400]))
              for path, data in zip(candidates[:400], downloaded):
                  if selected >= 100:
                      break
                  if not data or not usable(path,data,category):
                      continue
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in global_hashes:
                      continue
                  global_hashes.add(digest)
                  stem = re.sub(r"[^A-Za-z0-9_-]+","_",Path(path).stem)[:80]
                  base = f"{selected+1:03d}_{stem}"
                  (out/(base+".svg")).write_bytes(data)
                  entries.append({"file":base,"source_path":path.split("::",1)[-1],"source_url":({"A":"https://github.com/ikks/openclipartcollection/blob/main/","B":"https://github.com/cyanidecupcake/openclipart-svg/blob/master/","C":"https://github.com/millette/oca/blob/master/","D":"https://github.com/rg1024/openclipart-public/blob/master/"}[path.split("::",1)[0]])+urllib.parse.quote(path.split("::",1)[-1],safe="/"),"license":"OpenClipart public domain / CC0"})
                  selected += 1
              if selected != 100:
                  raise SystemExit(f"{category}: only {selected}/100 usable unique SVGs found")
              manifest["categories"][category] = entries

          (ROOT/"MANIFEST.json").write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding="utf-8")
          (ROOT/"LICENSE-AND-SOURCE.txt").write_text(
              "SOURCE: https://github.com/ikks/openclipartcollection\n"
              "OpenClipart states its clipart is public domain/CC0 and permits commercial use.\n"
              "The underlying artwork is sourced from OpenClipart; AGT Studio did not create the original artwork.\n"
              "Verify current Etsy rules and individual source records before commercial listing.\n",
              encoding="utf-8")
          print("BUILT 1000 ASSETS")

          PY
          python3 build/make_pack.py
          cd build
          zip -qr AGTStudioCO-Halloween-1000-CC0-Sourced.zip halloween_1000
          sha256sum AGTStudioCO-Halloween-1000-CC0-Sourced.zip > SHA256.txt

      - name: Upload finished ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGTStudioCO-Halloween-1000-CC0-Sourced
          path: |
            build/AGTStudioCO-Halloween-1000-CC0-Sourced.zip
            build/SHA256.txt
          retention-days: 14
