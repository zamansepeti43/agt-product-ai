name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Show toolchain
        run: node --version && npm --version
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/agt-product-ai.log 2>&1 &
          echo $! > /tmp/agt-product-ai.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/agt-health.json; then break; fi
            sleep 1
          done
          test -s /tmp/agt-health.json
          cat /tmp/agt-health.json
      - name: API smoke test
        run: |
          curl -fsS -X POST http://127.0.0.1:3000/api/catalog \
            -H 'Content-Type: application/json' \
            -d '{"name":"Test Ürün","category":"Genel","brand":"AGT","keywords":["test","ürün"],"marketplace":"generic","language":"tr"}' > /tmp/agt-catalog.json
          test -s /tmp/agt-catalog.json
          cat /tmp/agt-catalog.json
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/agt-product-ai.pid ]; then kill $(cat /tmp/agt-product-ai.pid) || true; fi
