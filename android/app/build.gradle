plugins { id "com.android.application" }
def buildVersionCode = (project.findProperty("versionCode") ?: "41").toString().toInteger()
def buildVersionName = (project.findProperty("versionName") ?: "1.0.41").toString()
android {
 namespace "com.agtstudio.productai"
 compileSdk 35
 signingConfigs {
   debug {
     storeFile file("../agt-debug.keystore")
     storePassword "android"
     keyAlias "androiddebugkey"
     keyPassword "android"
     v1SigningEnabled true
     v2SigningEnabled true
   }
 }
 defaultConfig {
   applicationId "com.agtstudio.productai.test"
   minSdk 24
   targetSdk 35
   versionCode buildVersionCode
   versionName buildVersionName
 }
 buildFeatures { buildConfig true }
 buildTypes {
   debug { signingConfig signingConfigs.debug }
   release { minifyEnabled false; shrinkResources false }
 }
}
dependencies { implementation "androidx.webkit:webkit:1.12.1"; implementation "androidx.core:core:1.15.0" }