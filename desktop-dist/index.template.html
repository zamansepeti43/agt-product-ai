<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGT Product AI</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#f5f7fb}main{text-align:center;max-width:520px;padding:32px}h1{margin:0 0 10px;font-size:28px}p{margin:0;color:#aeb6c4;line-height:1.55}#error{display:none;color:#ff9c9c;margin-top:16px}button{display:none;margin:20px auto 0;padding:10px 16px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>AGT Product AI</h1>
    <p id="status">Uygulama başlatılıyor…</p>
    <p id="error"></p>
    <button id="retry" onclick="start()">Tekrar dene</button>
  </main>
  <script>
    const APP_URL = "__AGT_APP_URL__";
    function start(){
      const status=document.getElementById('status'), error=document.getElementById('error'), retry=document.getElementById('retry');
      try {
        const url=new URL(APP_URL);
        if(url.protocol!=='https:' && url.protocol!=='http:') throw new Error('Geçersiz uygulama adresi.');
        status.textContent='Güvenli bağlantı kuruluyor…';
        error.style.display='none'; retry.style.display='none';
        window.location.replace(url.href);
      } catch(e) {
        status.textContent='Uygulama başlatılamadı.';
        error.textContent=e.message || 'Üretim uygulaması adresi yapılandırılmamış.';
        error.style.display='block'; retry.style.display='inline-block';
      }
    }
    start();
  </script>
</body>
</html>
