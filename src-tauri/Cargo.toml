[package]
name = "agt-product-ai"
version = "0.5.0"
description = "AGT Product AI desktop shell"
authors = ["AGT Studio"]
edition = "2021"

[lib]
name = "agt_product_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

auto-launch = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
